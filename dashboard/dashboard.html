
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Playwright Execution Dashboard</title>
    
<style>


body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    margin:40px;
}

h1{
    text-align:center;
      margin-bottom:40px;
}

h2{
    margin-top:40px;
}
.summary{
    display:flex;
    gap:20px;
    justify-content:center;
    margin-bottom:40px;
}
.card{
    background:white;
    width:160px;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.card h3{
    margin-top:0;
}

.card p{
    font-size:32px;
    font-weight:bold;
    margin:0;
}
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

th,
td{
    border:1px solid #ddd;
    padding:12px;
    text-align:left;
}

th{
    background:#f2f2f2;
}
</style>
</head>

<body>

    <h1>Playwright Execution Dashboard</h1>

    <h2>Execution Summary</h2>

    
    <div class="summary">
    
        <div class="card">
            <h3>Total</h3>
            <p>0</p>
        </div>
    
        <div class="card">
            <h3>Passed</h3>
            <p>0</p>
        </div>
    
        <div class="card">
            <h3>Failed</h3>
            <p>0</p>
        </div>
    
        <div class="card">
            <h3>Skipped</h3>
            <p>0</p>
        </div>
    
        <div class="card">
            <h3>Pass Rate</h3>
            <p>0%</p>
        </div>
    
    </div>
    

    
    <h2>Execution Details</h2>
    
    <table>
    
    <tr>
        <td><strong>Environment</strong></td>
        <td>QA</td>
    </tr>
    
    <tr>
        <td><strong>Browser</strong></td>
        <td>chromium</td>
    </tr>
    
    <tr>
        <td><strong>Duration</strong></td>
        <td>0.06 sec</td>
    </tr>
    
    <tr>
        <td><strong>Executed At</strong></td>
        <td>2026-07-25T21:39:19.360Z</td>
    </tr>
    
    </table>
    

    
    <h2>Test Results</h2>
    
    <table>
    
    <thead>
    <tr>
        <th>Test Name</th>
        <th>Status</th>
        <th>Duration</th>
    </tr>
    </thead>
    
    <tbody>
    
    </tbody>
    
    </table>
    

</body>

</html>
