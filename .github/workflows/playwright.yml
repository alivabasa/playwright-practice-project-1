# .github/workflows/playwright.yml

name: Playwright Test Suite

on:
  # Run on every push to main
  push:
    branches: [main]

  # Run on every pull request targeting main
  pull_request:
    branches: [main]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Run all matrix jobs even if one fails
      fail-fast: false
      matrix:
        # Split tests across 2 shards for speed
        # Shard 1 runs half the tests, Shard 2 runs the other half
        # Both run in parallel — cuts total time roughly in half
        shard: [1, 2]
        shardTotal: [2]

    steps:

      # Step 1 — Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache node_modules — skips npm install if package-lock.json unchanged
          cache: 'npm'

      # Step 3 — Install dependencies
      - name: Install dependencies
        run: npm ci
        # npm ci is stricter than npm install —
        # it uses exact versions from package-lock.json
        # never updates anything — important for CI stability

      # Step 4 — Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        # --with-deps installs OS-level dependencies too
        # Only install what you use — chromium + firefox here

      # Step 5 — Run tests
      - name: Run Playwright tests
        run: |
          npx playwright test \
            --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}
        env:
          # Inject secrets from GitHub — never hardcode these
          BASE_URL:              ${{ secrets.BASE_URL }}
          API_URL:               ${{ secrets.API_URL }}
          TEST_USER_EMAIL:       ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD:    ${{ secrets.TEST_USER_PASSWORD }}
          CI:                    true

      # Step 6 — Upload the blob report (needed for merge-reports later)
      # NOTE: with reporter: [['blob'], ...] in CI, Playwright writes to blob-report/
      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        # 'always()' means this runs whether tests passed or failed
        # Critical — you need the report most when tests fail
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          # Keep reports for 14 days — enough for any sprint investigation

      # Step 7 — Upload failed test screenshots and videos
      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-test-artifacts-shard-${{ matrix.shard }}
          path: |
            test-results/
          retention-days: 7

  # Second job — merge shard reports into one after both shards finish
  merge-reports:
    name: Merge Test Reports
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download both shards' blob reports into ONE shared folder —
      # merge-reports expects all blob files together, not split across folders
      - name: Download shard 1 blob report
        uses: actions/download-artifact@v4
        with:
          name: blob-report-shard-1
          path: all-blob-reports

      - name: Download shard 2 blob report
        uses: actions/download-artifact@v4
        with:
          name: blob-report-shard-2
          path: all-blob-reports

      # Merge into one unified HTML report
      - name: Merge reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            ./all-blob-reports

      # Upload the merged report
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 14